<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Quản lý chờ duyệt</title>
    <link rel="icon" type="image/png" href="/image/cay.jfif">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <style>
        .table-hover tbody tr:hover {
            background-color: #f8f9fa;
        }
        .table-warning {
            background-color: #fff3cd !important;
        }
        .btn-group-sm .btn {
            border-radius: 0.25rem;
            margin: 0 2px;
        }
        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .card-header {
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }
        .nav-tabs .nav-link {
            color: #6c757d;
            border: none;
            border-bottom: 2px solid transparent;
        }
        .nav-tabs .nav-link:hover {
            border-bottom-color: #dee2e6;
        }
        .nav-tabs .nav-link.active {
            color: #495057;
            border-bottom-color: #0d6efd;
            background-color: transparent;
        }
    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/1.1.3/sweetalert.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/1.1.3/sweetalert.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/css/toastr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.0.2/js/toastr.min.js"></script>
    <link rel="stylesheet" href="/admin/css/styleadmin.css">
    <script src="/admin/js/main.js"></script>
    <script src="/admin/js/pending-approval.js"></script>
    <script>
        window.onload = async function() {
            await loadPendingPlants(0);
            await loadPendingArticles(0);
        }
    </script>
</head>
<body>
  <div class="d-flex">
    <div id="header-admin"></div>
    <div class="flex-grow-1 d-flex flex-column">
      <div id="navbar-admin"></div>
      <main class="main bg-light flex-grow-1">
        <div class="container py-4">
            <div class="mb-4">
                <h1 class="h4 fw-bold text-dark mb-1">Quản lý chờ duyệt</h1>
                <p class="text-muted small mb-0">Duyệt hoặc từ chối các bài đăng từ người dùng</p>
            </div>

            <!-- Tabs -->
            <ul class="nav nav-tabs mb-4" id="approvalTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="plants-tab" data-bs-toggle="tab" data-bs-target="#plants" type="button" role="tab">
                        Cây dược liệu (<span id="plantsCount">0</span>)
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="articles-tab" data-bs-toggle="tab" data-bs-target="#articles" type="button" role="tab">
                        Bài viết (<span id="articlesCount">0</span>)
                    </button>
                </li>
            </ul>

            <div class="tab-content" id="approvalTabsContent">
                <!-- Tab Cây dược liệu -->
                <div class="tab-pane fade show active" id="plants" role="tabpanel">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Cây dược liệu chờ duyệt</h5>
                            <div class="d-flex gap-2">
                                <input type="text" class="form-control form-control-sm" id="plantSearch" placeholder="Tìm kiếm..." style="width: 200px;">
                                <button class="btn btn-sm btn-primary" onclick="loadPendingPlants(0)">Tìm kiếm</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Ảnh</th>
                                            <th>Tên cây</th>
                                            <th>Tên khoa học</th>
                                            <th>Người đăng</th>
                                            <th>Ngày đăng</th>
                                            <th>Thao tác</th>
                                        </tr>
                                    </thead>
                                    <tbody id="plantsTableBody">
                                        <tr>
                                            <td colspan="7" class="text-center">Đang tải...</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <nav>
                                <ul class="pagination justify-content-center" id="plantsPagination"></ul>
                            </nav>
                        </div>
                    </div>
                </div>

                <!-- Tab Bài viết -->
                <div class="tab-pane fade" id="articles" role="tabpanel">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Bài viết chờ duyệt</h5>
                            <div class="d-flex gap-2">
                                <input type="text" class="form-control form-control-sm" id="articleSearch" placeholder="Tìm kiếm..." style="width: 200px;">
                                <button class="btn btn-sm btn-primary" onclick="loadPendingArticles(0)">Tìm kiếm</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Ảnh</th>
                                            <th>Tiêu đề</th>
                                            <th>Tác giả</th>
                                            <th>Ngày đăng</th>
                                            <th>Thao tác</th>
                                        </tr>
                                    </thead>
                                    <tbody id="articlesTableBody">
                                        <tr>
                                            <td colspan="6" class="text-center">Đang tải...</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <nav>
                                <ul class="pagination justify-content-center" id="articlesPagination"></ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
