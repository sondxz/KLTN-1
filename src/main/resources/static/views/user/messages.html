<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin nhắn - DuocLieuVN</title>
    <link rel="icon" type="image/png" href="/image/cay.jfif">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/css/toastr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.0.2/js/toastr.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/main.js"></script>
    <style>
        .chat-container {
            height: calc(100vh - 200px);
            max-height: 800px;
        }
        .chat-messages {
            height: calc(100% - 120px);
            overflow-y: auto;
            padding: 15px;
            background-color: #f8f9fa;
        }
        .message-item {
            margin-bottom: 15px;
            display: flex;
        }
        .message-item.sent {
            justify-content: flex-end;
        }
        .message-bubble {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 12px;
        }
        .message-item.sent .message-bubble {
            background-color: #007bff;
            color: white;
        }
        .message-item.received .message-bubble {
            background-color: white;
            border: 1px solid #dee2e6;
        }
        .chat-image {
            max-width: 300px;
            max-height: 300px;
            border-radius: 8px;
            cursor: pointer;
        }
        .chat-file {
            display: inline-block;
            padding: 8px 12px;
            background-color: #f8f9fa;
            border-radius: 8px;
            text-decoration: none;
            color: #007bff;
        }
        .file-preview {
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<header id="header-main"></header>

<div class="container py-4">
    <div class="row">
        <div class="col-12">
            <h2 class="mb-4">
                <i class="bi bi-envelope me-2"></i>Tin nhắn của tôi
            </h2>
            
            <div class="row">
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">Danh sách chuyên gia</h5>
                        </div>
                        <div class="list-group list-group-flush" id="expertsList" style="max-height: 600px; overflow-y: auto;">
                            <div class="text-center text-muted p-3">
                                <i class="bi bi-arrow-repeat spin"></i> Đang tải...
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0" id="conversationTitle">Chọn chuyên gia để xem tin nhắn</h5>
                        </div>
                        <div class="card-body p-0">
                            <div id="conversationContent">
                                <div class="text-center text-muted p-5">
                                    <i class="bi bi-chat-dots" style="font-size: 3rem;"></i>
                                    <p class="mt-3">Chọn một chuyên gia từ danh sách bên trái để xem tin nhắn</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Image Modal -->
<div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content bg-transparent border-0">
            <div class="modal-header border-0">
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center">
                <img src="" id="modalImage" class="img-fluid" alt="Full size image">
            </div>
        </div>
    </div>
</div>

<footer class="pt-5" id="footer-main"></footer>
<script src="/js/user-messages.js"></script>
</body>
</html>
