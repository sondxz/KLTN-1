spring.mail.properties.mail.debug=true

# WebSocket Configuration
websocket.allowed.origins=http://localhost:8080,https://yourdomain.com
websocket.rate.limit.messages-per-second=10
websocket.rate.limit.messages-per-minute=60
websocket.file.max-size=10485760

# Session Configuration
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=strict
