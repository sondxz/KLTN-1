spring.application.name=cayduoclieu

spring.jpa.hibernate.ddl-auto=validate
# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/cayduoclieu?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pooling (HikariCP) - Production ready
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# Production: tắt show-sql để tăng performance
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.id.new_generator_mappings=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.main.lazy-initialization=true

springdoc.swagger-ui.path=/swagger-ui-custom.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/api-docs

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# Production: bật cache để tăng performance
spring.thymeleaf.cache=true
spring.thymeleaf.enabled=true
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.template-resolver-order=1

gemini.api.key=AIzaSyDznsvN4-ADEFRqpTIBPwP70EkMHFj4kJg
security.jwt.secret=${SECURITY_JWT_SECRET:change-me-in-prod}

