<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Tin nhắn</title>
    <link rel="icon" type="image/png" href="/image/cay.jfif">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/css/toastr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.0.2/js/toastr.min.js"></script>
    <link rel="stylesheet" href="/admin/css/styleadmin.css">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="/admin/js/main.js"></script>
    <script src="/admin/js/expert-messages.js"></script>
</head>
<body>
<div class="d-flex">
    <div id="header-admin"></div>
    <div class="flex-grow-1 d-flex flex-column">
        <div id="navbar-admin"></div>
        <main class="main bg-light flex-grow-1">
            <div class="container py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="h4 fw-bold text-dark mb-1">Tin nhắn từ người dùng</h1>
                        <p class="text-muted small mb-0">Xem và trả lời các câu hỏi của người dùng</p>
                    </div>
                    <div>
                        <span class="badge bg-primary" id="unreadMessageBadge" style="display: none;">0</span>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0">Danh sách người dùng</h5>
                            </div>
                            <div class="list-group list-group-flush" id="conversationPartnersList" style="max-height: 600px; overflow-y: auto;">
                                <!-- Danh sách sẽ được load ở đây -->
                            </div>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0" id="conversationTitle">Chọn người dùng để xem tin nhắn</h5>
                            </div>
                            <div class="card-body" id="conversationContent">
                                <div class="text-center text-muted p-5">
                                    <i class="bi bi-chat-dots" style="font-size: 3rem;"></i>
                                    <p class="mt-3">Chọn một người dùng từ danh sách bên trái để xem tin nhắn</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Modal để trả lời tin nhắn -->
<div class="modal fade" id="expertReplyModal" tabindex="-1" aria-labelledby="expertReplyModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="expertReplyModalLabel">
                    <i class="bi bi-chat-dots-fill"></i> Trả lời tin nhắn
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0">
                <div id="expertReplyMessages" class="p-3" style="max-height: 400px; overflow-y: auto; background-color: #f8f9fa;">
                    <!-- Messages will be loaded here -->
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
