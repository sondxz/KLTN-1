<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Thêm Bài thuốc dân gian</title>
  <link rel="icon" type="image/png" href="/image/cay.jfif">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/1.1.3/sweetalert.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/1.1.3/sweetalert.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/css/toastr.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.0.2/js/toastr.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <link rel="stylesheet" href="/admin/css/styleadmin.css">
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  <script src="/admin/js/main.js"></script>
  <script src="/admin/js/create-folk-remedy.js"></script>
  <script>
    window.onload = async function() {
        await loadDiseasesList();
        await loadPlantsList();
        
        // Khởi tạo Select2
        $('#diseases').select2({
            placeholder: "Tìm kiếm bệnh...",
            allowClear: true
        });
        $('#plants').select2({
            placeholder: "Tìm kiếm cây dược liệu...",
            allowClear: true
        });

        loadRemedyData();
    }
  </script>
</head>
<body>
  <div class="d-flex">
    <div id="header-admin"></div>
    <div class="flex-grow-1 d-flex flex-column">
      <div id="navbar-admin"></div>
      <main class="main bg-light flex-grow-1">
        <div class="container py-4">
        <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between mb-4 px-3">
            <div>
                <h1 class="h4 fw-bold text-dark mb-1">Thêm/Sửa Bài thuốc dân gian</h1>
                <p class="text-muted small mb-0">Nhập thông tin chi tiết của bài thuốc</p>
            </div>
            <div class="mt-3 mt-sm-0">
                <button onclick="saveRemedy()" id="btnSave" class="btn btn-success d-flex align-items-center gap-1">
                <i data-lucide="save"></i>
                <span>Lưu thông tin</span>
                </button>
            </div>
        </div>
        <div id="articleForm">
            <ul class="nav nav-tabs" id="articleTabs" role="tablist">
                <li class="nav-item" role="presentation">
                <button class="nav-link active" id="content-tab" data-bs-toggle="tab" data-bs-target="#content" type="button" role="tab">
                    Thông tin cơ bản
                </button>
                </li>
            </ul>
            <div class="tab-content mt-3" id="articleTabsContent">
                <!-- Nội dung -->
                <div class="tab-pane fade show active" id="content" role="tabpanel">
                <div class="row g-4">
                    <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header">
                        <h5 class="mb-0">Chi tiết bài thuốc</h5>
                        </div>
                        <div class="card-body">
                        <div class="mb-3">
                            <label for="name" class="form-label">Tên bài thuốc <span class="text-danger">*</span></label>
                            <input onkeyup="createSlug(this.value)" type="text" class="form-control" id="name" placeholder="Ví dụ: Bài thuốc trị ho từ Cam thảo">
                        </div>
                        <div class="mb-3">
                            <label for="slug" class="form-label">Đường dẫn (Slug)</label>
                            <input type="text" class="form-control" id="slug" placeholder="bai-thuoc-tri-ho">
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Mô tả tóm tắt</label>
                            <textarea class="form-control" id="description" rows="3" placeholder="Nhập mô tả tóm tắt ngắn gọn..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Hướng dẫn sử dụng (Cách dùng) <span class="text-danger">*</span></label>
                            <div id="editor-usage" style="height: 150px;"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Cách bào chế / Chuẩn bị</label>
                            <div id="editor-preparation" style="height: 150px;"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Chống chỉ định / Lưu ý</label>
                            <div id="editor-contraindication" style="height: 150px;"></div>
                        </div>
                        </div>
                    </div>
                    </div>

                    <!-- Sidebar phải -->
                    <div class="col-lg-4">
                    <!-- Trạng thái -->
                    <div class="card mb-4">
                        <div class="card-header">
                        <h6 class="mb-0">Quản lý Xuất bản</h6>
                        </div>
                        <div class="card-body">
                        <div class="mb-3">
                            <label for="status" class="form-label">Trạng thái duyệt</label>
                            <select id="status" class="form-select">
                                <option value="pending">Chờ duyệt</option>
                                <option value="approved">Đã duyệt (Công khai)</option>
                                <option value="rejected">Bị từ chối</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="source" class="form-label">Nguồn trích dẫn</label>
                            <input type="text" class="form-control" id="source" placeholder="Sách Đông Y, YHCT...">
                        </div>
                        </div>
                    </div>

                    <!-- Liên kết bệnh -->
                    <div class="card mb-4">
                        <div class="card-header">
                        <h6 class="mb-0">Bệnh liên quan</h6>
                        </div>
                        <div class="card-body">
                            <label class="form-label text-muted small">Giữ Ctrl (hoặc Cmd) để chọn nhiều</label>
                            <select multiple class="form-control" id="diseases" style="height: 150px;">
                            </select>
                        </div>
                    </div>

                    <!-- Liên kết cây -->
                    <div class="card mb-4">
                        <div class="card-header">
                        <h6 class="mb-0">Cây dược liệu liên quan</h6>
                        </div>
                        <div class="card-body">
                            <label class="form-label text-muted small">Giữ Ctrl (hoặc Cmd) để chọn nhiều</label>
                            <select multiple class="form-control" id="plants" style="height: 200px;">
                            </select>
                        </div>
                    </div>

                    </div>
                </div>
                </div>
            </div>
        </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <script>
    function createSlug(name) {
      let slug = name.toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s-]/g, "")
        .replace(/[\s_-]+/g, "-")
        .trim("-");
      document.getElementById("slug").value = slug;
    }
  </script>
</body>
</html>
