<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DuocLieuVN - Chuyên gia</title>
    <link rel="icon" type="image/png" href="/image/cay.jfif">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/main.js"></script>
    <script src="/js/expert.js"></script>
    <script>
      window.onload = async function() {
        await loadExperts();
      }
    </script>
</head>
<body>
<header id="header-main"></header>
<div class="container py-5">
  <!-- Header -->
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">
    <div>
      <h1 class="fw-bold text-dark fs-2">Chuyên gia dược liệu</h1>
      <p class="text-muted mt-2">Danh sách các chuyên gia trong lĩnh vực dược liệu</p>
    </div>
    <div>
      <button class="btn btn-outline-secondary d-flex align-items-center gap-2">
        <i class="bi bi-funnel"></i> Lọc
      </button>
    </div>
  </div>

  <!-- Search + Filter -->
  <div class="bg-white shadow-sm p-4 rounded mb-5">
    <div class="row g-3">
      <div class="col-md-8">
        <div class="position-relative">
          <span class="position-absolute top-50 start-0 translate-middle-y ps-3 text-muted">
            <i class="bi bi-search"></i>
          </span>
          <input type="text" class="form-control ps-5" id="searchInput" placeholder="Tìm kiếm chuyên gia...">
        </div>
      </div>
      <div class="col-md-2">
        <select class="form-select" id="specializationFilter">
          <option value="">Tất cả chuyên môn</option>
          <option value="Da liễu">Da liễu</option>
          <option value="Tim mạch">Tim mạch</option>
          <option value="Dinh dưỡng">Dinh dưỡng</option>
          <option value="Nội khoa">Nội khoa</option>
          <option value="Ngoại khoa">Ngoại khoa</option>
          <option value="Sản phụ khoa">Sản phụ khoa</option>
          <option value="Nhi khoa">Nhi khoa</option>
          <option value="Y học cổ truyền">Y học cổ truyền</option>
          <option value="Dược lý học">Dược lý học</option>
          <option value="Hóa dược">Hóa dược</option>
          <option value="Dược liệu học">Dược liệu học</option>
          <option value="Thực vật học">Thực vật học</option>
          <option value="Đông y">Đông y</option>
          <option value="Nam y">Nam y</option>
          <option value="Ung bướu">Ung bướu</option>
          <option value="Thần kinh">Thần kinh</option>
          <option value="Tâm thần">Tâm thần</option>
          <option value="Mắt">Mắt</option>
          <option value="Tai mũi họng">Tai mũi họng</option>
          <option value="Răng hàm mặt">Răng hàm mặt</option>
          <option value="Xương khớp">Xương khớp</option>
          <option value="Vật lý trị liệu">Vật lý trị liệu</option>
          <option value="Phục hồi chức năng">Phục hồi chức năng</option>
          <option value="Y tế công cộng">Y tế công cộng</option>
          <option value="Dịch tễ học">Dịch tễ học</option>
          <option value="Vi sinh y học">Vi sinh y học</option>
          <option value="Giải phẫu bệnh">Giải phẫu bệnh</option>
          <option value="Huyết học">Huyết học</option>
          <option value="Miễn dịch học">Miễn dịch học</option>
          <option value="Sinh lý học">Sinh lý học</option>
          <option value="Giải phẫu học">Giải phẫu học</option>
        </select>
      </div>
      <div class="col-md-2">
        <select class="form-select" id="sortFilter">
          <option value="">Sắp xếp</option>
          <option value="name-asc">Tên A-Z</option>
          <option value="name-desc">Tên Z-A</option>
          <option value="newest">Mới nhất</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Experts Grid -->
  <div class="row g-4 mb-5 experts-grid"></div>

  <!-- Pagination -->
  <div class="d-flex justify-content-center mt-4">
    <ul class="pagination mb-0"></ul>
  </div>
</div>


<footer class="pt-5" id="footer-main"></footer>
</body>
</html>
