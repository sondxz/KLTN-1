services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cayduoclieu-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/cayduoclieu?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      WEBSOCKET_ALLOWED_ORIGINS: ${WEBSOCKET_ALLOWED_ORIGINS:-http://localhost:8080}
      SERVER_FORWARD_HEADERS_STRATEGY: native
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CLOUDFLARE_WORKER_URL: ${CLOUDFLARE_WORKER_URL:-https://restless-poetry-0bc8.hoangsonnguyen204.workers.dev/}
      CLOUDFLARE_WORKER_API_KEY: ${CLOUDFLARE_WORKER_API_KEY:-123456}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-change-me-in-prod}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  mysql-db:
    image: mysql:8.0
    container_name: cayduoclieu-mysql
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: cayduoclieu
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init/01-cayduoclieu.sql:/docker-entrypoint-initdb.d/01-cayduoclieu.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5m
    networks:
      - app-network
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge
